name: Sync submissions to Notion

on:
  push:
    branches:
      - main
    paths:
      - "프로그래머스/**"
      - "백준/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out submissions
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync changed submissions
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: |
          python3 scripts/sync_notion.py \
            --before "$GITHUB_EVENT_BEFORE" \
            --after "$GITHUB_SHA"
